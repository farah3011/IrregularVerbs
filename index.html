<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Irregular Verbs Showdown</title>
<style>
:root{--bg:#fff7e6;--card:#fff;--ink:#1f2340;--mute:#6b6f8d;--p:#6c4cff;--ok:#16a34a;--bad:#e11d48;--warn:#f59e0b;--line:#e6e0f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15162b;--card:#22244a;--ink:#f4f3ff;--mute:#a9acd0;--p:#9d86ff;--ok:#34d399;--bad:#fb7185;--warn:#fbbf24;--line:#3a3d73}}
*{box-sizing:border-box}
html,body{margin:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{touch-action:manipulation;-webkit-appearance:none;appearance:none}
body{background:var(--bg);color:var(--ink);font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:16px}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 15% 10%,#ff7ab855 0,transparent 35%),radial-gradient(circle at 90% 80%,#6c4cff44 0,transparent 40%);pointer-events:none}
.app{width:100%;max-width:640px;position:relative;z-index:1}
.card{background:var(--card);border:3px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:22px}
h1{font-size:clamp(30px,8vw,46px);margin:6px 0;line-height:1.05}
h1 span{color:var(--p)}
.hero{text-align:center}
.emoji{font-size:64px;animation:bob 1.6s ease-in-out infinite;display:inline-block}
@keyframes bob{50%{transform:translateY(-10px) rotate(6deg)}}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.chip{background:var(--bg);border:2px solid var(--ink);border-radius:99px;padding:4px 12px;font-weight:600;font-size:14px}
.btn{font:inherit;font-weight:700;font-size:20px;background:var(--p);color:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px 28px;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn{min-height:52px}
@media (max-width:480px){body{padding:10px}.card{padding:16px;border-radius:20px}.timer{width:64px;height:64px}.timer svg{width:64px;height:64px}.timer b{font-size:20px}.next .btn{width:100%}.opt{font-size:16px}}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;font-weight:700}
.pill{background:var(--card);border:2px solid var(--ink);border-radius:99px;padding:4px 12px;font-size:15px}
.bar{height:12px;background:var(--line);border-radius:9px;border:2px solid var(--ink);overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--p);transition:width .4s}
.qrow{display:flex;gap:14px;align-items:center}
.timer{position:relative;width:76px;height:76px;flex:none}
.timer svg{transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:9}
.timer .t{stroke:var(--line)}
.timer .f{stroke:var(--ok);stroke-linecap:round}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px}
.timer.low b{color:var(--bad);animation:pulse .5s infinite}
.timer.low .f{stroke:var(--bad)}
@keyframes pulse{50%{transform:scale(1.25)}}
.tag{font-size:12px;letter-spacing:.08em;color:var(--p);font-weight:700;text-transform:uppercase}
.q{font-size:clamp(19px,4.6vw,24px);font-weight:700;margin:2px 0 0;line-height:1.3}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{font:inherit;font-size:17px;font-weight:600;text-align:left;color:var(--ink);background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:center;box-shadow:0 4px 0 var(--ink);transition:transform .08s}
@media (hover:hover){.opt:hover:not(:disabled){transform:translateY(-2px)}}
.opt{min-height:58px}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-size:15px}
.opt.right{background:var(--ok);color:#fff;animation:pop .4s}
.opt.wrong{background:var(--bad);color:#fff;animation:shake .4s}
.opt:disabled{cursor:default}
.opt.dim{opacity:.55}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.fb{margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--bg);border:2px dashed var(--ink);font-size:16px}
.fb strong{display:block;font-size:19px;margin-bottom:2px}
.next{margin-top:14px;text-align:right}
.score{font-size:72px;font-weight:800;color:var(--p);line-height:1}
.rev{text-align:left;margin:16px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.rev li{background:var(--bg);border-radius:10px;padding:7px 10px;font-size:15px}
.hidden{display:none}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:5;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="app">

<div id="start" class="card hero">
  <div class="emoji">🚀</div>
  <h1>Irregular Verbs <span>Showdown!</span></h1>
  <p>write → wrote → written… can you beat the clock?</p>
  <div class="chips"><span class="chip">🎯 10 questions</span><span class="chip">⏱️ 45 seconds each</span><span class="chip">🔥 streak bonus</span></div>
  <button class="btn" id="go">Let’s go!</button>
</div>

<div id="play" class="hidden">
  <div class="top"><span class="pill" id="qn">Q 1/10</span><span class="pill" id="streak">🔥 0</span><span class="pill" id="pts">⭐ 0</span></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card">
    <div class="qrow">
      <div class="timer" id="timer">
        <svg width="76" height="76" viewBox="0 0 76 76"><circle class="t" cx="38" cy="38" r="32"/><circle class="f" id="ring" cx="38" cy="38" r="32" stroke-dasharray="201.06" stroke-dashoffset="0"/></svg>
        <b id="sec">45</b>
      </div>
      <div><div class="tag" id="tag"></div><p class="q" id="q"></p></div>
    </div>
    <div class="opts" id="opts"></div>
    <div id="fb" class="fb hidden"></div>
    <div class="next hidden" id="nx"><button class="btn" id="next">Next ➜</button></div>
  </div>
</div>

<div id="end" class="card hero hidden">
  <div class="emoji" id="eEmoji">🏆</div>
  <h1 id="eTitle">Amazing!</h1>
  <div class="score" id="eScore">0</div>
  <p id="eSub"></p>
  <ul class="rev" id="rev"></ul>
  <p><button class="btn" id="again">Play again 🔁</button></p>
</div>

</div>
<script>
const QS=[
 {t:"Past participle",q:"Which is the correct past participle of “take”?",o:["taken","took","taked","taking"],e:"take → took → taken. Use “taken” with has/have: “has taken stunning pictures.”"},
 {t:"Past tense",q:"Which sentence uses the correct past tense of “fly”?",o:["The Marzetti family flew to Florida to see their relatives.","The Marzetti family flied to Florida to see their relatives.","The Marzetti family has flew to Florida to see their relatives.","The Marzetti family flown to Florida to see their relatives."],e:"fly → flew → flown. Simple past = “flew”. “Flown” needs has/have."},
 {t:"Fill the gap",q:"“The rain ______ into a slick sheet of ice.”",o:["has frozen","has froze","have frozen","freezed"],e:"“The rain” is singular → has. The past participle of freeze is “frozen”."},
 {t:"Spot the correct one",q:"Which sentence uses the verb form correctly?",o:["The thieves have stolen money from five banks.","The thieves have stole money from five banks.","The thieves have steal money from five banks.","The thieves has stolen money from five banks."],e:"“The thieves” is plural → have, plus the participle “stolen” (steal → stole → stolen)."},
 {t:"Think & vote",q:"Why haven’t you ______ to me more often?",o:["written","wrote","writed","writing"],e:"write → wrote → written. “Haven’t” is a helping verb, so we need the past participle."},
 {t:"Past tense",q:"The Saint Bernard ______ two big bowls of dog food.",o:["ate","eated","eaten","eat"],e:"eat → ate → eaten. With no helping verb, use the simple past: “ate”."},
 {t:"Past tense",q:"The crowd ______ ecstatic as the home team won at the buzzer.",o:["became","becomed","become","becoming"],e:"become → became → become. The simple past is “became”."},
 {t:"Past participle",q:"Olivia has ______ her best friend for seven years.",o:["known","knew","knowed","knowing"],e:"know → knew → known. “Has” needs the past participle “known”."},
 {t:"Past participle",q:"The corn has ______ very quickly this summer.",o:["grown","grew","growed","growing"],e:"grow → grew → grown. “Has” needs the past participle “grown”."},
 {t:"Correct the error",q:"“In 1497, Vasco da Gama ______ an expedition around the Cape of Good Hope.” Pick the right verb.",o:["led","leaded","lead","leading"],e:"lead → led → led. Irregular verbs don’t just add -ed!"}
];
const $=id=>document.getElementById(id), TIME=45, C=2*Math.PI*32;
let i,score,streak,best,right,t0,raf,done,order,log;
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a};
function show(id){["start","play","end"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
function begin(){i=0;score=0;streak=0;best=0;right=0;log=[];order=shuffle(QS.map((_,k)=>k));show("play");load()}
function load(){
  done=false;const Q=QS[order[i]];
  $("qn").textContent="Q "+(i+1)+"/10";$("prog").style.width=(i/10*100)+"%";
  $("tag").textContent=Q.t;$("q").textContent=Q.q;
  $("fb").classList.add("hidden");$("nx").classList.add("hidden");
  const box=$("opts");box.innerHTML="";
  shuffle(Q.o).forEach((txt,k)=>{
    const b=document.createElement("button");b.className="opt";
    b.innerHTML="<b>"+"ABCD"[k]+"</b><span></span>";b.lastChild.textContent=txt;
    b.onclick=()=>answer(b,txt);box.appendChild(b)});
  $("streak").textContent="🔥 "+streak;$("pts").textContent="⭐ "+score;
  t0=performance.now();cancelAnimationFrame(raf);tick();
}
function tick(){
  const left=Math.max(0,TIME-(performance.now()-t0)/1000);
  $("sec").textContent=Math.ceil(left);
  $("ring").style.strokeDashoffset=C*(1-left/TIME);
  $("timer").classList.toggle("low",left<=10);
  if(left<=0&&!done){answer(null,null);return}
  if(!done)raf=requestAnimationFrame(tick);
}
function answer(btn,txt){
  if(done)return;done=true;cancelAnimationFrame(raf);
  const Q=QS[order[i]],ok=txt===Q.o[0],left=Math.max(0,TIME-(performance.now()-t0)/1000);
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;
    if(b.lastChild.textContent===Q.o[0])b.classList.add("right");
    else if(b===btn)b.classList.add("wrong");else b.classList.add("dim")});
  let msg;
  if(ok){streak++;best=Math.max(best,streak);right++;const g=100+Math.round(left)+(streak>1?(streak-1)*10:0);score+=g;
    msg="<strong>🎉 Correct! +"+g+"</strong>";if(streak>=3)confetti(24)}
  else{streak=0;msg="<strong>"+(btn?"😅 Not quite!":"⏰ Time’s up!")+"</strong>"}
  $("fb").innerHTML=msg+Q.e;$("fb").classList.remove("hidden");
  $("streak").textContent="🔥 "+streak;$("pts").textContent="⭐ "+score;
  $("next").textContent=i===9?"See results 🏁":"Next ➜";$("nx").classList.remove("hidden");
  setTimeout(()=>$("nx").scrollIntoView({behavior:"smooth",block:"nearest"}),150);
  log.push({q:Q.q,a:Q.o[0],ok});
}
function finish(){
  show("end");$("prog").style.width="100%";
  const r=right,e=r>=9?["🏆","Verb Master!"]:r>=7?["🌟","Great job!"]:r>=5?["💪","Nice effort!"]:["📚","Keep practicing!"];
  $("eEmoji").textContent=e[0];$("eTitle").textContent=e[1];$("eScore").textContent=score;
  $("eSub").textContent=r+" / 10 correct · best streak "+best+" 🔥";
  $("rev").innerHTML="";
  log.forEach(l=>{const li=document.createElement("li");li.textContent=(l.ok?"✅ ":"❌ ")+l.a;$("rev").appendChild(li)});
  if(r>=7)confetti(70);
}
function confetti(n){
  const cols=["#6c4cff","#ff7ab8","#f59e0b","#16a34a","#38bdf8"];
  for(let k=0;k<n;k++){const d=document.createElement("div");d.className="conf";
    d.style.left=Math.random()*100+"vw";d.style.background=cols[k%5];
    d.style.animationDuration=(1.8+Math.random()*1.8)+"s";d.style.animationDelay=Math.random()*.4+"s";
    document.body.appendChild(d);setTimeout(()=>d.remove(),4500)}
}
$("go").onclick=begin;$("again").onclick=begin;
$("next").onclick=()=>{i===9?finish():(i++,load())};
</script>
</body>
</html>
